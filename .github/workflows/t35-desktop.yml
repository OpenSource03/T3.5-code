# T3.5 Code desktop installers, unsigned. Every master push builds downloadable
# preview artifacts (no update feed). A `v*` tag builds release versions and
# publishes them as a GitHub Release, which also serves the in-app update feed
# for Windows and Linux. Unsigned macOS apps cannot auto-update.
name: T3.5 Desktop

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t35-desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-latest
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base="$(node -p "require('./apps/desktop/package.json').version")"
            version="${base}-preview.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick

      # The resource monitor links against Spectre-mitigated MSVC runtime libraries.
      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            Write-Error "Visual Studio Installer failed"
            exit 1
          }

      - name: Align package versions
        shell: bash
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build desktop artifact
        shell: bash
        env:
          T3CODE_DESKTOP_OUTPUT_DIR: ${{ runner.temp }}/release
        run: |
          vp run dist:desktop:artifact \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --arch "${{ matrix.arch }}" \
            --build-version "${{ steps.version.outputs.version }}" \
            --verbose

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: t35-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/release/*.dmg
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.exe
            ${{ runner.temp }}/release/*.AppImage
            ${{ runner.temp }}/release/*.blockmap
            ${{ runner.temp }}/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: t35-desktop-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "T3.5 Code $GITHUB_REF_NAME" \
            --notes "Unsigned builds. On macOS, right-click the app and choose Open the first time, or run: xattr -dr com.apple.quarantine \"/Applications/T3 Code (Alpha).app\"" \
            "${prerelease[@]}"
